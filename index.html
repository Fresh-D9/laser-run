<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LASER RUN</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Подключаем Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <script>
        // Здесь будет находиться наша игра
        const config = {
            type: Phaser.AUTO,

            width: 1280,
            height: 720,

            backgroundColor: '#181818',

            physics: {
                default: 'arcade',

                arcade: {
                    gravity: {
                        y: 1000
                    },
                    debug: true
                }
            },

            scene: {
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let player;
        let platforms;
        let cursors;
        let lasers;
        let finish;
        let winText;
        
        let playerLaser;
        let lastDirection = 1;
        let spaceKey;

        let enemy;
        let enemyDirection = 1;

        let battery;
        let laserEnergy = 0;
        let energyText;
        let laserEnergyDrain = 30;

        let startX = 200;
        let startY = 500;

        function create() {

            // Заголовок
            this.add.text(
                640,
                50,
                'LASER RUN',
                {
                    fontFamily: 'Arial',
                    fontSize: '48px',
                    color: '#ffffff'
                }
            ).setOrigin(0.5);

            energyText = this.add.text(
                30,
                30,
                'LASER ENERGY: 0',
                {
                    fontFamily: 'Arial',
                    fontSize: '24px',
                    color: '#ffff00'
                }
            );


            // =====================================================
            // СОЗДАЁМ ПРОСТЫЕ ТЕКСТУРЫ ДЛЯ ПРОТОТИПА
            // =====================================================

            // Текстура игрока
            const playerGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            playerGraphics.fillStyle(0xff3333);
            playerGraphics.fillRect(0, 0, 40, 60);
            playerGraphics.generateTexture(
                'player',
                40,
                60
            );

            playerGraphics.destroy();


            // Текстура платформы
            const platformGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            platformGraphics.fillStyle(0x555555);
            platformGraphics.fillRect(0, 0, 250, 30);
            platformGraphics.generateTexture(
                'platform',
                250,
                30
            );

            platformGraphics.destroy();

            // Текстура лазера
            const laserGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            laserGraphics.fillStyle(0xff0000);
            laserGraphics.fillRect(0, 0, 220, 12);

            laserGraphics.generateTexture(
                'laser',
                220,
                12
            );

            laserGraphics.destroy();

            // Текстура финиша
            const finishGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            finishGraphics.fillStyle(0x00ff66);
            finishGraphics.fillRect(0, 0, 50, 100);

            finishGraphics.generateTexture(
                'finish',
                50,
                100
            );

            finishGraphics.destroy();

            // Текстура врага
            const enemyGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            enemyGraphics.fillStyle(0x888888);
            enemyGraphics.fillRect(0, 0, 50, 40);

            enemyGraphics.generateTexture(
                'enemy',
                50,
                40
            );

            enemyGraphics.destroy();

            // Текстура аккумулятора
            const batteryGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            batteryGraphics.fillStyle(0xffff00);
            batteryGraphics.fillRect(0, 0, 30, 45);

            batteryGraphics.fillStyle(0x333333);
            batteryGraphics.fillRect(8, 0, 14, 7);

            batteryGraphics.generateTexture(
                'battery',
                30,
                45
            );

            batteryGraphics.destroy();


            // =====================================================
            // ПЛАТФОРМЫ
            // =====================================================

            platforms = this.physics.add.staticGroup();

            lasers = this.physics.add.staticGroup();

            finish = this.physics.add.staticGroup();


            // Земля
            platforms.create(
                640,
                650,
                'platform'
            );


            // Средняя платформа
            platforms.create(
                400,
                500,
                'platform'
            );


            // Верхняя платформа
            platforms.create(
                800,
                400,
                'platform'
            );

            // Первый лазер
            lasers.create(
                850,
                570,
                'laser'
            );

            // Финиш
            finish.create(
                1100,
                570,
                'finish'
            );


            // =====================================================
            // ИГРОК
            // =====================================================

            player = this.physics.add.sprite(
                200,
                500,
                'player'
            );


            // Не даём игроку выйти за пределы экрана
            player.setCollideWorldBounds(true);

            playerLaser = this.add.graphics();

            // =====================================================
            // ВРАГ
            // =====================================================

            enemy = this.physics.add.sprite(
                400,
                465,
                'enemy'
            );

            enemy.setImmovable(true);
            enemy.body.allowGravity = false;

            // =====================================================
            // АККУМУЛЯТОР
            // =====================================================

            battery = this.physics.add.sprite(
                650,
                612,
                'battery'
            );

            battery.body.allowGravity = false;


            // =====================================================
            // СТОЛКНОВЕНИЕ С ПЛАТФОРМАМИ
            // =====================================================

            this.physics.add.collider(
                player,
                platforms
            );

            this.physics.add.collider(
                player,
                enemy,
                hitEnemy,
                null,
                this
            );

            this.physics.add.collider(
                player,
                lasers,
                hitLaser,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                finish,
                reachFinish,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                battery,
                collectBattery,
                null,
                this
            );


            // =====================================================
            // УПРАВЛЕНИЕ
            // =====================================================

            cursors = this.input.keyboard.createCursorKeys();

            spaceKey = this.input.keyboard.addKey(
                Phaser.Input.Keyboard.KeyCodes.SPACE
            );

            this.input.keyboard.on(
                'keydown-ENTER',
                restartGame,
                this
            );
        }

        function update() {

            // Движение врага

            if (enemy && enemy.active) {

                enemy.setVelocityX(
                    enemyDirection * 100
                );

                if (enemy.x >= 550) {
                    enemyDirection = -1;
                }

                if (enemy.x <= 250) {
                    enemyDirection = 1;
                }
            }
            
            if (cursors.left.isDown) {

                player.setVelocityX(-300);
                lastDirection = -1;

            } else if (cursors.right.isDown) {

                player.setVelocityX(300);
                lastDirection = 1;

            } else {

                player.setVelocityX(0);
            }


            // Прыжок
            if (
                cursors.up.isDown &&
                player.body.blocked.down
            ) {

                player.setVelocityY(-600);

            }

            playerLaser.clear();

            if (
                spaceKey.isDown &&
                laserEnergy > 0
            ) {

                playerLaser.lineStyle(
                    6,
                    0xff0000,
                    1
                );

                const startX = player.x;
                const startY = player.y;

                const endX =
                    lastDirection === 1
                        ? 1280
                        : 0;

                playerLaser.beginPath();

                playerLaser.moveTo(
                    startX,
                    startY
                );

                playerLaser.lineTo(
                    endX,
                    startY
                );

                playerLaser.strokePath();


                // Расход энергии

                laserEnergy -=
                    laserEnergyDrain *
                    (this.game.loop.delta / 1000);

                if (laserEnergy < 0) {
                    laserEnergy = 0;
                }

                energyText.setText(
                    'LASER ENERGY: ' +
                    Math.ceil(laserEnergy)
                );
            }

            // Проверяем попадание лазера во врага

            if (
                enemy &&
                enemy.active &&
                spaceKey.isDown &&
                laserEnergy > 0
            ) {

                const laserStartX = player.x;

                const laserEndX =
                    lastDirection === 1
                        ? 1280
                        : 0;

                const enemyIsInLaserX =
                    enemy.x >= Math.min(
                        laserStartX,
                        laserEndX
                    ) &&
                    enemy.x <= Math.max(
                        laserStartX,
                        laserEndX
                    );

                const enemyIsInLaserY =
                    Math.abs(
                        enemy.y - player.y
                    ) < 25;

                if (
                    enemyIsInLaserX &&
                    enemyIsInLaserY
                ) {
                    enemy.destroy();
                }
            }
        }

        function hitLaser() {

            player.setPosition(
                startX,
                startY
            );

            player.setVelocity(
                0,
                0
            );
        }

        function hitEnemy() {

            player.setPosition(
                startX,
                startY
            );

            player.setVelocity(
                0,
                0
            );
        }

        function reachFinish() {

            player.setVelocity(
                0,
                0
            );

            player.body.moves = false;

            winText = this.add.text(
                640,
                300,
                'ПОБЕДА!\n\nНажмите ENTER для повторной игры',
                {
                    fontFamily: 'Arial',
                    fontSize: '40px',
                    color: '#00ff66',
                    align: 'center'
                }
            ).setOrigin(0.5);
        }

        function restartGame() {

            if (winText) {
                winText.destroy();
                winText = null;
            }

            player.setPosition(
                startX,
                startY
            );

            player.setVelocity(
                0,
                0
            );

            player.body.moves = true;


            // Восстанавливаем врага

            if (!enemy || !enemy.active) {

                enemy = this.physics.add.sprite(
                    400,
                    465,
                    'enemy'
                );

                enemy.setImmovable(true);
                enemy.body.allowGravity = false;

                this.physics.add.collider(
                    player,
                    enemy,
                    hitEnemy,
                    null,
                    this
                );
            }

            enemy.setPosition(
                400,
                465
            );

            enemy.setVelocityX(0);

            enemyDirection = 1;

            // Восстанавливаем аккумулятор

            if (!battery || !battery.active) {

                battery = this.physics.add.sprite(
                    650,
                    612,
                    'battery'
                );

                battery.body.allowGravity = false;

                this.physics.add.overlap(
                    player,
                    battery,
                    collectBattery,
                    null,
                    this
                );
            }

            battery.setPosition(
                650,
                612
            );

            laserEnergy = 0;

            energyText.setText(
                'LASER ENERGY: ' + laserEnergy
            );
        }

        function collectBattery() {

            laserEnergy += 100;

            battery.destroy();

            energyText.setText(
                'LASER ENERGY: ' + laserEnergy
            );
        }

    </script>

</body>
</html>
