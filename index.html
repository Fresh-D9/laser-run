<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LASER RUN</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Подключаем Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <script>
        // Здесь будет находиться наша игра
        const config = {

            type: Phaser.AUTO,

            width: 1280,
            height: 720,

            backgroundColor: '#181818',

            physics: {
                default: 'arcade',

                arcade: {
                    gravity: {
                        y: 1000
                    },

                    debug: true
                }
            },

            scene: [
                {
                    key: 'Level1',
                    create: create,
                    update: update
                },

                {
                    key: 'Level2',
                    create: createLevel2,
                    update: updateLevel2
                }
            ]
        };

        const game = new Phaser.Game(config);

        // =====================================================
        // ДАННЫЕ УРОВНЕЙ
        // =====================================================

        const LEVELS = {

            1: {

                width: 5000,

                player: {
                    x: 200,
                    y: 500
                },

                platforms: [

                    // Земля
                    [125, 650],
                    [375, 650],

                    // Первый разрыв
                    [750, 650],
                    [1000, 650],

                    [1250, 650],
                    [1500, 650],
                    [1750, 650],

                    // Платформы уровня
                    [450, 500],
                    [800, 420],
                    [1150, 500],
                    [1450, 420],
                    [1500, 500],

                    // Дальнейшая часть уровня
                    [2200, 400],
                    [3000, 550]
                ],

                lasers: [
                    [850, 570]
                ],

                enemies: [
                    [400, 465]
                ],

                batteries: [
                    [650, 612]
                ],

                extraLives: [
                    [1000, 600]
                ],

                checkpoints: [
                    [1200, 580]
                ],

                laserSwitch: [
                    [1350, 450]
                ],

                door: [
                    [1550, 520]
                ],

                finish: [
                    [1650, 570]
                ]
            },


            // =================================================
            // LEVEL 2
            // =================================================

            2: {

                width: 5000,

                player: {
                    x: 200,
                    y: 500
                },

                platforms: [
                    // Пока пусто.
                    // Позже сюда добавим платформы Level 2.
                ],

                lasers: [],

                enemies: [],

                batteries: [],

                extraLives: [],

                checkpoints: [],

                laserSwitch: [],

                door: [],

                finish: []
            }
        };

        let player;
        let platforms;
        let cursors;
        let lasers;
        let finish;
        let winText;
        
        let playerLaser;
        let lastDirection = 1;
        let spaceKey;

        let enemy;
        let enemyDirection = 1;

        let battery;
        let laserEnergy = 0;
        let energyText;
        let switchText;
        let laserEnergyDrain = 30;

        let laserSwitch;
        let switchActivated = false;
        let switchProgress = 0;

        let door;

        let lives = 3;
        let maxLives = 5;

        let livesText;

        let extraLives;

        let checkpoints;

        let checkpointX;
        let checkpointY;

        let checkpointActivated = false;

        let startX = 200;
        let startY = 500;

        function create() {

            const levelData = LEVELS[1];
            
            // =====================================================
            // СБРОС СОСТОЯНИЯ УРОВНЯ
            // =====================================================

            laserEnergy = 0;

            switchProgress = 0;

            switchActivated = false;

            enemyDirection = 1;

            lastDirection = 1;

            lives = 3;

            checkpointX = startX;
            checkpointY = startY;

            checkpointActivated = false;

            winText = null;
            
            this.physics.world.setBounds(
                0,
                0,
                5000,
                720
            );
            
            // Заголовок
            this.add.text(
                640,
                50,
                'LASER RUN',
                {
                    fontFamily: 'Arial',
                    fontSize: '48px',
                    color: '#ffffff'
                }
            ).setOrigin(0.5);

            energyText = this.add.text(
                30,
                30,
                'LASER ENERGY: 0',
                {
                    fontFamily: 'Arial',
                    fontSize: '24px',
                    color: '#ffff00'
                }
            );

            energyText.setScrollFactor(0);

            // Отображение жизней
            livesText = this.add.text(
                30,
                95,
                'LIVES: ❤️❤️❤️',
                {
                    fontFamily: 'Arial',
                    fontSize: '22px',
                    color: '#ffffff'
                }
            );

            livesText.setScrollFactor(0);

            updateLivesText();

            switchText = this.add.text(
                30,
                65,
                '',
                {
                    fontFamily: 'Arial',
                    fontSize: '20px',
                    color: '#ffffff'
                }
            );

            switchText.setScrollFactor(0);


            // =====================================================
            // СОЗДАЁМ ПРОСТЫЕ ТЕКСТУРЫ ДЛЯ ПРОТОТИПА
            // =====================================================

            // Текстура игрока
            const playerGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            playerGraphics.fillStyle(0xff3333);
            playerGraphics.fillRect(0, 0, 40, 60);
            playerGraphics.generateTexture(
                'player',
                40,
                60
            );

            playerGraphics.destroy();


            // Текстура платформы
            const platformGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            platformGraphics.fillStyle(0x555555);
            platformGraphics.fillRect(0, 0, 250, 30);
            platformGraphics.generateTexture(
                'platform',
                250,
                30
            );

            platformGraphics.destroy();

            // Текстура лазера
            const laserGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            laserGraphics.fillStyle(0xff0000);
            laserGraphics.fillRect(0, 0, 220, 12);

            laserGraphics.generateTexture(
                'laser',
                220,
                12
            );

            laserGraphics.destroy();

            // Текстура финиша
            const finishGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            finishGraphics.fillStyle(0x00ff66);
            finishGraphics.fillRect(0, 0, 80, 120);

            finishGraphics.generateTexture(
                'finish',
                80,
                120
            );

            finishGraphics.destroy();

            // Текстура врага
            const enemyGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            enemyGraphics.fillStyle(0x888888);
            enemyGraphics.fillRect(0, 0, 50, 40);

            enemyGraphics.generateTexture(
                'enemy',
                50,
                40
            );

            enemyGraphics.destroy();

            // Текстура аккумулятора
            const batteryGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            batteryGraphics.fillStyle(0xffff00);
            batteryGraphics.fillRect(0, 0, 30, 45);

            batteryGraphics.fillStyle(0x333333);
            batteryGraphics.fillRect(8, 0, 14, 7);

            batteryGraphics.generateTexture(
                'battery',
                30,
                45
            );

            batteryGraphics.destroy();

            // Текстура лазерного переключателя

            const switchGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            switchGraphics.fillStyle(0x666666);
            switchGraphics.fillRect(0, 0, 50, 50);

            switchGraphics.fillStyle(0xff0000);
            switchGraphics.fillCircle(
                25,
                25,
                12
            );

            switchGraphics.generateTexture(
                'laserSwitch',
                50,
                50
            );

            switchGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА ДВЕРИ
            // =====================================================

            const doorGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            doorGraphics.fillStyle(0x333333);
            doorGraphics.fillRect(0, 0, 80, 180);

            doorGraphics.fillStyle(0x777777);
            doorGraphics.fillRect(10, 10, 60, 160);

            doorGraphics.generateTexture(
                'door',
                80,
                180
            );

            doorGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА ДОПОЛНИТЕЛЬНОЙ ЖИЗНИ
            // =====================================================

            const lifeGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            lifeGraphics.fillStyle(0xff3333);

            lifeGraphics.fillCircle(
                15,
                12,
                10
            );

            lifeGraphics.fillCircle(
                30,
                12,
                10
            );

            lifeGraphics.fillTriangle(
                5,
                15,
                40,
                15,
                22,
                38
            );

            lifeGraphics.generateTexture(
                'extraLife',
                45,
                40
            );

            lifeGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА CHECKPOINT
            // =====================================================

            const checkpointGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            checkpointGraphics.fillStyle(0x666666);
            checkpointGraphics.fillRect(
                18,
                0,
                6,
                70
            );

            checkpointGraphics.fillStyle(0xffcc00);
            checkpointGraphics.fillTriangle(
                24,
                5,
                65,
                20,
                24,
                35
            );

            checkpointGraphics.generateTexture(
                'checkpoint',
                70,
                70
            );

            checkpointGraphics.destroy();


            // =====================================================
            // ПЛАТФОРМЫ
            // =====================================================

            platforms = this.physics.add.staticGroup();

            lasers = this.physics.add.staticGroup();

            extraLives = this.physics.add.staticGroup();

            checkpoints = this.physics.add.staticGroup();

            finish = this.physics.add.staticGroup();


            // =====================================================
            // ПЛАТФОРМЫ УРОВНЯ
            // =====================================================

            levelData.platforms.forEach(([x, y]) => {

                platforms.create(
                    x,
                    y,
                    'platform'
                );

            });

            // СОЗДАНИЕ ЛАЗЕРА-ЛОВУШКИ
            levelData.lasers.forEach(([x, y]) => {
                lasers.create(x, y, 'laser');
            });

            // Финиш
            finish.create(
                1650,
                570,
                'finish'
            );

            // Чекпоинт
            levelData.checkpoints.forEach(([x, y]) => {
                checkpoints.create(x, y, 'checkpoint');
            });


            // =====================================================
            // ИГРОК
            // =====================================================

            player = this.physics.add.sprite(
                200,
                500,
                'player'
            );

            // Переключатель
            levelData.laserSwitch.forEach(([x, y]) => {
                laserSwitch = this.physics.add.staticImage(x, y, 'laserSwitch');
            });

            // =====================================================
            // ДВЕРЬ
            // =====================================================
            levelData.door.forEach(([x, y]) => {
                door = this.physics.add.staticImage(x, y, 'door');
            });

            // Дополнительная жизнь
            levelData.extraLives.forEach(([x, y]) => {
                extraLives.create(x, y, 'extraLife');
            });


            // Не даём игроку выйти за пределы экрана
            player.setCollideWorldBounds(false);

            playerLaser = this.add.graphics();

            this.cameras.main.setBounds(
                0,
                0,
                5000,
                720
            );

            this.cameras.main.startFollow(
                player,
                true,
                0.08,
                0.08
            );

            // =====================================================
            // ВРАГ
            // =====================================================

            levelData.enemies.forEach(([x, y]) => {
                enemy = this.physics.add.sprite(x, y, 'enemy');
                enemy.setImmovable(true);
                enemy.body.allowGravity = false;
            });

            // =====================================================
            // АККУМУЛЯТОР
            // =====================================================

            levelData.batteries.forEach(([x, y]) => {
                battery = this.physics.add.sprite(x, y, 'battery');
                battery.body.allowGravity = false;
            });

            // =====================================================
            // СТОЛКНОВЕНИЕ С ПЛАТФОРМАМИ
            // =====================================================

            this.physics.add.collider(
                player,
                platforms
            );

            this.physics.add.collider(
                player,
                door
            );

            this.physics.add.collider(
                player,
                enemy,
                hitEnemy,
                null,
                this
            );

            this.physics.add.collider(
                player,
                lasers,
                hitLaser,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                finish,
                reachFinish,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                battery,
                collectBattery,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                extraLives,
                collectExtraLife,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                checkpoints,
                activateCheckpoint,
                null,
                this
            );


            // =====================================================
            // УПРАВЛЕНИЕ
            // =====================================================

            cursors = this.input.keyboard.createCursorKeys();

            spaceKey = this.input.keyboard.addKey(
                Phaser.Input.Keyboard.KeyCodes.SPACE
            );

            this.input.keyboard.on(
                'keydown-ENTER',
                restartGame,
                this
            );
        }

        function update() {

            // Движение врага

            if (enemy && enemy.active) {

                enemy.setVelocityX(
                    enemyDirection * 100
                );

                if (enemy.x >= 550) {
                    enemyDirection = -1;
                }

                if (enemy.x <= 350) {
                    enemyDirection = 1;
                }
            }
            
            if (cursors.left.isDown) {

                player.setVelocityX(-300);
                lastDirection = -1;

            } else if (cursors.right.isDown) {

                player.setVelocityX(300);
                lastDirection = 1;

            } else {

                player.setVelocityX(0);
            }


            // Прыжок
            if (
                cursors.up.isDown &&
                player.body.blocked.down
            ) {

                player.setVelocityY(-600);

            }

            playerLaser.clear();

            if (
                spaceKey.isDown &&
                laserEnergy > 0
            ) {

                playerLaser.lineStyle(
                    6,
                    0xff0000,
                    1
                );

                const startX = player.x;
                const startY = player.y;

                const camera = this.cameras.main;

                const endX =
                    lastDirection === 1
                        ? camera.scrollX + camera.width
                        : camera.scrollX;

                playerLaser.beginPath();

                playerLaser.moveTo(
                    startX,
                    startY
                );

                playerLaser.lineTo(
                    endX,
                    startY
                );

                playerLaser.strokePath();


                // Расход энергии

                laserEnergy -=
                    laserEnergyDrain *
                    (this.game.loop.delta / 1000);

                if (laserEnergy < 0) {
                    laserEnergy = 0;
                }

                energyText.setText(
                    'LASER ENERGY: ' +
                    Math.ceil(laserEnergy)
                );
            }

            // Проверяем попадание лазера во врага

            if (
                enemy &&
                enemy.active &&
                spaceKey.isDown &&
                laserEnergy > 0
            ) {

                const laserStartX = player.x;

                const camera = this.cameras.main;

                const laserEndX =
                    lastDirection === 1
                        ? camera.scrollX + camera.width
                        : camera.scrollX;

                const enemyIsInLaserX =
                    enemy.x >= Math.min(
                        laserStartX,
                        laserEndX
                    ) &&
                    enemy.x <= Math.max(
                        laserStartX,
                        laserEndX
                    );

                const enemyIsInLaserY =
                    Math.abs(
                        enemy.y - player.y
                    ) < 25;

                if (
                    enemyIsInLaserX &&
                    enemyIsInLaserY
                ) {
                    enemy.destroy();
                }
            }

            // Проверка попадания лазера в переключатель
            if (
                laserSwitch &&
                laserSwitch.active &&
                spaceKey.isDown &&
                laserEnergy > 0
            ) {

                const laserStartX = player.x;

                const laserEndX =
                    lastDirection === 1
                        ? this.cameras.main.scrollX +
                        this.cameras.main.width
                        : this.cameras.main.scrollX;

                const switchX = laserSwitch.x;

                const switchBounds =
                    laserSwitch.getBounds();

                const laserY = player.y;

                const laserHitsSwitch =
                    laserY >= switchBounds.top &&
                    laserY <= switchBounds.bottom &&
                    (
                        lastDirection === 1
                            ? switchBounds.left >= laserStartX &&
                            switchBounds.left <= laserEndX
                            : switchBounds.right <= laserStartX &&
                            switchBounds.right >= laserEndX
                    );

                if (laserHitsSwitch) {

                    switchProgress = Math.min(
                        2,
                        switchProgress +
                        this.game.loop.delta / 1000
                    );

                    switchText.setText(
                        'MECHANISM: ' +
                        Math.floor(
                            switchProgress * 50
                        ) +
                        '%'
                    );

                    if (switchProgress >= 2) {

                        switchActivated = true;

                        laserSwitch.setTint(
                            0x00ff00
                        );

                        door.disableBody(
                            true,
                            true
                        );
                    }

                    switchText.setText(
                        'MECHANISM: ' +
                        Math.floor(
                            switchProgress * 50
                        ) +
                        '%'
                    );
                }
            }

            // Не даём игроку выйти за пределы уровня по горизонтали

            if (player.x < 20) {
                player.x = 20;
                player.setVelocityX(0);
            }

            if (player.x > 4980) {
                player.x = 4980;
                player.setVelocityX(0);
            }

            // =====================================================
            // ПАДЕНИЕ В ПРОПАСТЬ
            // =====================================================

            if (player.y > 750) {

                playerDeath.call(this);

            }
        }

        function hitLaser() {

            playerDeath.call(this);

        }

        function hitEnemy() {

            playerDeath.call(this);

        }

        function reachFinish() {

            this.scene.start('Level2');

        }

        function restartGame() {

            this.scene.restart();

        }

        function collectBattery() {

            laserEnergy += 100;

            battery.destroy();

            energyText.setText(
                'LASER ENERGY: ' + laserEnergy
            );
        }

        function updateLivesText() {

            let hearts = '';

            for (let i = 0; i < lives; i++) {
                hearts += '❤️';
            }

            livesText.setText(
                'LIVES: ' + hearts
            );
        }

        function playerDeath() {

            lives--;

            updateLivesText();

            if (lives <= 0) {

                restartGame.call(this);

                return;
            }

            player.setPosition(
                checkpointX,
                checkpointY
            );

            this.cameras.main.centerOn(
                checkpointX,
                checkpointY
            );

            player.setVelocity(
                0,
                0
            );
        }

        function collectExtraLife(player, life) {

            if (lives < maxLives) {

                lives++;

                updateLivesText();

                life.disableBody(
                    true,
                    true
                );
            }
        }

        function activateCheckpoint(player, checkpoint) {

            checkpointX = checkpoint.x;
            checkpointY = checkpoint.y;

            checkpointActivated = true;

            checkpoint.setTint(
                0x00ff00
            );
        }

        // =====================================================
        // LEVEL 2
        // =====================================================

        function createLevel2() {

            this.add.text(
                640,
                200,
                'LEVEL 2',
                {
                    fontFamily: 'Arial',
                    fontSize: '64px',
                    color: '#ffffff'
                }
            ).setOrigin(0.5);


            this.add.text(
                640,
                300,
                'Новый уровень',
                {
                    fontFamily: 'Arial',
                    fontSize: '28px',
                    color: '#aaaaaa'
                }
            ).setOrigin(0.5);
        }


        function updateLevel2() {

        }

    </script>

</body>
</html>
