<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LASER RUN</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #mobileControls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            display: none;

            pointer-events: none;

            z-index: 1000;
        }

        #movementButtons,
        #actionButtons {
            position: absolute;
            bottom: 20px;

            display: flex;
            gap: 12px;

            pointer-events: auto;
        }

        #movementButtons {
            left: 20px;
        }

        #actionButtons {
            right: 20px;
        }

        .mobileButton {
            width: 70px;
            height: 70px;

            border: none;
            border-radius: 18px;

            background: rgba(0, 0, 0, 0.55);
            color: white;

            font-size: 30px;
            font-weight: bold;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        .mobileButton:active {
            background: rgba(255, 0, 0, 0.75);
            transform: scale(0.95);
        }

        @media (max-width: 900px) {

            #mobileControls {
                display: block;
            }
        }
    </style>
</head>

<body>

    <div id="mobileControls">

        <div id="movementButtons">

            <button
                id="leftButton"
                class="mobileButton"
            >
                ◀
            </button>

            <button
                id="rightButton"
                class="mobileButton"
            >
                ▶
            </button>

        </div>

        <div id="actionButtons">

            <button
                id="jumpButton"
                class="mobileButton"
            >
                ▲
            </button>

            <button
                id="laserButton"
                class="mobileButton"
            >
                🔴
            </button>

        </div>

    </div>
    
    <!-- Подключаем Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <script>
        // Здесь будет находиться наша игра
        const config = {

            type: Phaser.AUTO,

            width: 1280,
            height: 720,

            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 1280,
                height: 720
            },

            backgroundColor: '#181818',

            physics: {
                default: 'arcade',

                arcade: {
                    gravity: {
                        y: 1000
                    },

                    debug: true
                }
            },

            scene: [
                {
                    key: 'Level1',
                    preload: preload,
                    create: create,
                    update: update
                },

                {
                    key: 'Level2',
                    create: createLevel2,
                    update: updateLevel2
                }
            ]
        };

        const game = new Phaser.Game(config);

        // =====================================================
        // ДАННЫЕ УРОВНЕЙ
        // =====================================================

        const LEVELS = {

            1: {

                width: 5000,

                player: {
                    x: 200,
                    y: 500
                },

                platforms: [

                    // Земля
                    [125, 650],
                    [375, 650],
                    [625, 650],
                    [875, 650],

                    [1250, 650],
                    [1500, 650],
                    [1750, 650],

                    // Платформы уровня
                    [450, 500],
                    [800, 420],
                    [1150, 290],
                    [1450, 420],
                    [1750, 350],

                    // Дальнейшая часть уровня
                    [2200, 550],
                    [2600, 550],
                    [3000, 550],
                    [3400, 550],
                    [3800, 550],
                    [4200, 550],
                    [4600, 550],
                    [5000, 550]
                    
                ],

                lasers: [
                    [850, 570]
                ],

                enemies: [
                    {
                        x: 400,
                        y: 465,
                        type: 'drone',
                        scale: 0.55,
                        left: 300,
                        right: 550,
                        speed: 100,
                        damage: 1
                    },

                    {
                        x: 900,
                        y: 350,
                        type: 'flyingDrone',
                        scale: 0.40,
                        left: 800,
                        right: 1100,
                        speed: 150,
                        damage: 2
                    },

                    {
                        x: 1400,
                        y: 450,
                        type: 'fastDrone',
                        scale: 0.70,
                        left: 1250,
                        right: 1600,
                        speed: 70,
                        damage: 1
                    },

                    {
                        x: 1800,
                        y: 500,
                        type: 'heavyDrone',
                        scale: 0.80,
                        left: 1600,
                        right: 2100,
                        speed: 70,
                        damage: 1
                    }
                ],

                batteries: [
                    [650, 612]
                ],

                extraLives: [
                    [1000, 600]
                ],

                checkpoints: [
                    [1800, 500]
                ],

                laserSwitch: [
                    [1240, 345]
                ],

                door: [
                    [1520, 540]
                ],

                finish: [
                    [5000, 480]
                ]
            },


            // =================================================
            // LEVEL 2
            // =================================================

            2: {

                width: 5000,

                player: {
                    x: 200,
                    y: 500
                },

                platforms: [
                    // Пока пусто.
                    // Позже сюда добавим платформы Level 2.
                ],

                lasers: [],

                enemies: [],

                batteries: [],

                extraLives: [],

                checkpoints: [],

                laserSwitch: [],

                door: [],

                finish: []
            }
        };

        let currentLevelData;
        let player;
        let playerState = 'idle';

        let mobileLeft = false;
        let mobileRight = false;
        let mobileJump = false;
        let mobileLaser = false;

        let backgroundFar;
        let backgroundMid;
        let backgroundFront;

        let platforms;
        let cursors;
        let lasers;
        let finish;
        let winText;

        
        let playerLaser;
        let lastDirection = 1;
        let spaceKey;

        let enemies;
        let heavyDroneLaser;

        let battery;
        let laserEnergy = 0;
        let energyText;
        let switchText;
        let laserEnergyDrain = 30;

        let laserSwitch;
        let switchActivated = false;
        let switchProgress = 0;

        let door;

        let lives = 3;
        let maxLives = 5;

        let livesText;

        let extraLives;

        let checkpoints;

        let checkpointX;
        let checkpointY;

        let checkpointActivated = false;

        let startX = 200;
        let startY = 500;

        function getEnemySprite(type) {

            switch (type) {

                case 'drone':
                    return 'enemydrone1Sprite';

                case 'flyingDrone':
                    return 'enemyFlyDroneSprite';

                case 'fastDrone':
                    return 'enemyFastDroneSprite';

                case 'heavyDrone':
                    return 'enemyHeavyDroneSprite';

                default:
                    return 'enemydrone1Sprite';
            }
        }

        // =====================================================
        // НАСТРОЙКИ ТЯЖЁЛОГО ДРОНА
        // =====================================================

        const HEAVY_DRONE_CONFIG = {

            // Сколько времени дрон продолжает патрулировать
            // после обнаружения игрока
            detectionDelay: 1000,

            // Сколько времени дрон находится
            // в активном режиме перед первым выстрелом
            firstAimTime: 2000,

            // Сколько времени дрон находится
            // в активном режиме перед последующими выстрелами
            repeatAimTime: 1000,

            // Время перезарядки
            reloadTime: 2000,

            // Продолжительность видимого лазерного выстрела
            laserDuration: 150
        };

        // =====================================================
        // НАСТРОЙКИ БЫСТРОГО ДРОНА
        // =====================================================

        const FAST_DRONE_CONFIG = {
            detectionDelay: 1000,
            activeTime: 1000,
            chaseSpeed: 180
        };
                
        function preload() {
            this.load.spritesheet('playerRun', 'assets/player_run.png', {
                frameWidth: 256,
                frameHeight: 256
            });

            this.load.image(
                'playerHit',
                'assets/player-hit.png'
            );

            this.load.image(
                'platform',
                'assets/platform.png'
            );

            this.load.image('enemydrone1Sprite', 'assets/enemy-drone-1.png');

            this.load.image(
                'enemyFlyDroneSprite',
                'assets/enemy-flydrone.png'
            );

            this.load.image(
                'enemyFastDroneSprite',
                'assets/enemy-fastdrone.png'
            );

            this.load.image(
                'enemyFastDroneActiveSprite',
                'assets/enemy-fastdrone-active.png'
            );

            this.load.image(
                'enemyHeavyDroneSprite',
                'assets/enemy-heavydrone.png'
            );

            this.load.image(
                'enemyHeavyDroneActiveSprite',
                'assets/enemy-heavydrone-active.png'
            );

            this.load.image(
                'enemyHeavyDroneReloadSprite',
                'assets/enemy-heavydrone-reload.png'
            );

            this.load.image(
                'backgroundFar',
                'assets/background_far.png'
            );

            this.load.image(
                'backgroundMid',
                'assets/background_mid.png'
            );

            this.load.image(
                'backgroundFront',
                'assets/background_front.png'
            );
        }
        
        function create() {

            currentLevelData = LEVELS[1];

            startX = currentLevelData.player.x;
            startY = currentLevelData.player.y;
            
            // =====================================================
            // СБРОС СОСТОЯНИЯ УРОВНЯ
            // =====================================================

            laserEnergy = 0;

            switchProgress = 0;

            switchActivated = false;

            enemyDirection = 1;

            lastDirection = 1;

            lives = 3;

            checkpointX = startX;
            checkpointY = startY;

            checkpointActivated = false;

            winText = null;
            
            this.physics.world.setBounds(0, 0, currentLevelData.width, 720);

            // =====================================================
            // ФОН — FAR
            // =====================================================

            backgroundFar = this.add.tileSprite(
                currentLevelData.width / 2,
                360,
                currentLevelData.width,
                720,
                'backgroundFar'
            );

            backgroundFar.setScrollFactor(0.10);
            backgroundFar.setDepth(-30);

            // =====================================================
            // ФОН — MID
            // =====================================================

            backgroundMid = this.add.tileSprite(
                currentLevelData.width / 2,
                360,
                currentLevelData.width,
                720,
                'backgroundMid'
            );

            backgroundMid.setScrollFactor(0.40);
            backgroundMid.setDepth(-20);

            // =====================================================
            // ФОН — FRONT
            // =====================================================

            backgroundFront = this.add.tileSprite(
                currentLevelData.width / 2,
                360,
                currentLevelData.width,
                720,
                'backgroundFront'
            );

            backgroundFront.setScrollFactor(0.80);
            backgroundFront.setDepth(-10);
            
            // Заголовок
            this.add.text(
                640,
                50,
                'LASER RUN',
                {
                    fontFamily: 'Arial',
                    fontSize: '48px',
                    color: '#ffffff'
                }
            ).setOrigin(0.5);

            energyText = this.add.text(
                30,
                30,
                'LASER ENERGY: 0',
                {
                    fontFamily: 'Arial',
                    fontSize: '24px',
                    color: '#ffff00'
                }
            );

            energyText.setScrollFactor(0);

            // Отображение жизней
            livesText = this.add.text(
                30,
                95,
                'LIVES: ❤️❤️❤️',
                {
                    fontFamily: 'Arial',
                    fontSize: '22px',
                    color: '#ffffff'
                }
            );

            livesText.setScrollFactor(0);

            updateLivesText();

            switchText = this.add.text(
                30,
                65,
                '',
                {
                    fontFamily: 'Arial',
                    fontSize: '20px',
                    color: '#ffffff'
                }
            );

            switchText.setScrollFactor(0);


            // =====================================================
            // СОЗДАЁМ ПРОСТЫЕ ТЕКСТУРЫ ДЛЯ ПРОТОТИПА
            // =====================================================
                
            // Текстура лазера
            const laserGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            laserGraphics.fillStyle(0xff0000);
            laserGraphics.fillRect(0, 0, 220, 12);

            laserGraphics.generateTexture(
                'laser',
                220,
                12
            );

            laserGraphics.destroy();

            // Текстура финиша
            const finishGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            finishGraphics.fillStyle(0x00ff66);
            finishGraphics.fillRect(0, 0, 80, 120);

            finishGraphics.generateTexture(
                'finish',
                80,
                120
            );

            finishGraphics.destroy();

            // Текстура врага
            const enemyGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            enemyGraphics.fillStyle(0x888888);
            enemyGraphics.fillRect(0, 0, 50, 40);

            enemyGraphics.generateTexture(
                'enemy',
                50,
                40
            );

            enemyGraphics.destroy();

            // Текстура аккумулятора
            const batteryGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            batteryGraphics.fillStyle(0xffff00);
            batteryGraphics.fillRect(0, 0, 30, 45);

            batteryGraphics.fillStyle(0x333333);
            batteryGraphics.fillRect(8, 0, 14, 7);

            batteryGraphics.generateTexture(
                'battery',
                30,
                45
            );

            batteryGraphics.destroy();

            // Текстура лазерного переключателя

            const switchGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            switchGraphics.fillStyle(0x666666);
            switchGraphics.fillRect(0, 0, 50, 50);

            switchGraphics.fillStyle(0xff0000);
            switchGraphics.fillCircle(
                25,
                25,
                12
            );

            switchGraphics.generateTexture(
                'laserSwitch',
                50,
                50
            );

            switchGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА ДВЕРИ
            // =====================================================

            const doorGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            doorGraphics.fillStyle(0x333333);
            doorGraphics.fillRect(0, 0, 80, 180);

            doorGraphics.fillStyle(0x777777);
            doorGraphics.fillRect(10, 10, 60, 160);

            doorGraphics.generateTexture(
                'door',
                80,
                180
            );

            doorGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА ДОПОЛНИТЕЛЬНОЙ ЖИЗНИ
            // =====================================================

            const lifeGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            lifeGraphics.fillStyle(0xff3333);

            lifeGraphics.fillCircle(
                15,
                12,
                10
            );

            lifeGraphics.fillCircle(
                30,
                12,
                10
            );

            lifeGraphics.fillTriangle(
                5,
                15,
                40,
                15,
                22,
                38
            );

            lifeGraphics.generateTexture(
                'extraLife',
                45,
                40
            );

            lifeGraphics.destroy();

            // =====================================================
            // ТЕКСТУРА CHECKPOINT
            // =====================================================

            const checkpointGraphics = this.make.graphics({
                x: 0,
                y: 0,
                add: false
            });

            checkpointGraphics.fillStyle(0x666666);
            checkpointGraphics.fillRect(
                18,
                0,
                6,
                70
            );

            checkpointGraphics.fillStyle(0xffcc00);
            checkpointGraphics.fillTriangle(
                24,
                5,
                65,
                20,
                24,
                35
            );

            checkpointGraphics.generateTexture(
                'checkpoint',
                70,
                70
            );

            checkpointGraphics.destroy();


            // =====================================================
            // ПЛАТФОРМЫ
            // =====================================================

            platforms = this.physics.add.staticGroup();

            lasers = this.physics.add.staticGroup();

            extraLives = this.physics.add.staticGroup();

            checkpoints = this.physics.add.staticGroup();

            finish = this.physics.add.staticGroup();


            // =====================================================
            // ПЛАТФОРМЫ УРОВНЯ
            // =====================================================

            currentLevelData.platforms.forEach(([x, y]) => {
                const platform = platforms.create(x, y, 'platform');

                platform.body.setSize(250, 30);
                platform.body.setOffset(0, 15);
            });

            // СОЗДАНИЕ ЛАЗЕРА-ЛОВУШКИ
            currentLevelData.lasers.forEach(([x, y]) => {
                lasers.create(x, y, 'laser');
            });

            // Финиш
            currentLevelData.finish.forEach(([x, y]) => {
                finish.create(x, y, 'finish');
            });

            // Чекпоинт
            currentLevelData.checkpoints.forEach(([x, y]) => {
                checkpoints.create(x, y, 'checkpoint');
            });


            // =====================================================
            // АНИМАЦИЯ ИГРОКА
            // =====================================================

            // Анимация бега
            this.anims.create({
                key: 'player-run',
                frames: this.anims.generateFrameNumbers('playerRun', {
                    start: 0,
                    end: 7
                }),
                frameRate: 10,
                repeat: -1
            });

            // Анимация покоя
            this.anims.create({
                key: 'player-idle',
                frames: [
                    { key: 'playerRun', frame: 0 }
                ],
                frameRate: 1,
                repeat: -1
            });

            // Состояние подъёма в прыжке
            this.anims.create({
                key: 'player-jump-up',
                frames: [
                    { key: 'playerRun', frame: 1 }
                ],
                frameRate: 1,
                repeat: -1
            });

            // Состояние падения
            this.anims.create({
                key: 'player-jump-fall',
                frames: [
                    { key: 'playerRun', frame: 2 }
                ],
                frameRate: 1,
                repeat: -1
            });

            // Состояние стрельбы
            this.anims.create({
                key: 'player-shoot',
                frames: [
                    { key: 'playerRun', frame: 3 }
                ],
                frameRate: 1,
                repeat: -1
            });


            // =====================================================
            // ИГРОК
            // =====================================================

            player = this.physics.add.sprite(
                startX,
                startY,
                'playerRun'
            );

            player.setScale(0.55);

            player.body.setSize(120, 230);

            // Переключатель
            currentLevelData.laserSwitch.forEach(([x, y]) => {
                laserSwitch = this.physics.add.staticImage(x, y, 'laserSwitch');
            });

            // =====================================================
            // ДВЕРЬ
            // =====================================================
            currentLevelData.door.forEach(([x, y]) => {
                door = this.physics.add.staticImage(x, y, 'door');
            });

            // Дополнительная жизнь
            currentLevelData.extraLives.forEach(([x, y]) => {
                extraLives.create(x, y, 'extraLife');
            });


            // Не даём игроку выйти за пределы экрана
            player.setCollideWorldBounds(false);

            playerLaser = this.add.graphics();

            this.cameras.main.setBounds(0, 0, currentLevelData.width, 720);

            this.cameras.main.startFollow(
                player,
                true,
                0.08,
                0.08
            );

            // Лазер тяжёлого дрона
            heavyDroneLaser = this.add.graphics();

            // =====================================================
            // ВРАГИ
            // =====================================================

            enemies = this.physics.add.group();

            currentLevelData.enemies.forEach((enemyData) => {

                const enemy = enemies.create(
                    enemyData.x,
                    enemyData.y,
                    getEnemySprite(enemyData.type)
                );

                // Размер врага
                enemy.setScale(enemyData.scale);

                enemy.setImmovable(true);

                enemy.body.allowGravity = false;

                // Направление движения
                enemy.direction = 1;

                // Границы движения
                enemy.moveLeft = enemyData.left;
                enemy.moveRight = enemyData.right;

                // Скорость движения
                enemy.moveSpeed = enemyData.speed;

                // Урон
                enemy.damage = enemyData.damage;

                // Тип врага
                enemy.enemyType = enemyData.type;

                // =====================================================
                // СОСТОЯНИЕ ТЯЖЁЛОГО ДРОНА
                // =====================================================

                enemy.enemyType = enemyData.type;

                if (enemyData.type === 'heavyDrone') {

                    enemy.heavyState = 'patrol';
                    enemy.heavyStateTimer = 0;
                    enemy.heavyHasDetectedPlayer = false;
                }

                // =====================================================
                // СОСТОЯНИЕ БЫСТРОГО ДРОНА
                // =====================================================

                if (enemyData.type === 'fastDrone') {

                    enemy.fastState = 'patrol';
                    enemy.fastStateTimer = 0;
                }
            });

            // =====================================================
            // АККУМУЛЯТОР
            // =====================================================

            currentLevelData.batteries.forEach(([x, y]) => {
                battery = this.physics.add.sprite(x, y, 'battery');
                battery.body.allowGravity = false;
            });

            // =====================================================
            // СТОЛКНОВЕНИЕ С ПЛАТФОРМАМИ
            // =====================================================

            this.physics.add.collider(
                player,
                platforms
            );

            this.physics.add.collider(
                player,
                door
            );

            this.physics.add.collider(
                player,
                enemies,
                hitEnemy,
                null,
                this
            );

            this.physics.add.collider(
                player,
                lasers,
                hitLaser,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                finish,
                reachFinish,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                battery,
                collectBattery,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                extraLives,
                collectExtraLife,
                null,
                this
            );

            this.physics.add.overlap(
                player,
                checkpoints,
                activateCheckpoint,
                null,
                this
            );


            // =====================================================
            // УПРАВЛЕНИЕ
            // =====================================================

            cursors = this.input.keyboard.createCursorKeys();

            spaceKey = this.input.keyboard.addKey(
                Phaser.Input.Keyboard.KeyCodes.SPACE
            );

            this.input.keyboard.on(
                'keydown-ENTER',
                restartGame,
                this
            );

            // =====================================================
            // МОБИЛЬНОЕ УПРАВЛЕНИЕ
            // =====================================================

            const leftButton =
                document.getElementById('leftButton');

            const rightButton =
                document.getElementById('rightButton');

            const jumpButton =
                document.getElementById('jumpButton');

            const laserButton =
                document.getElementById('laserButton');


            // Движение влево

            leftButton.addEventListener(
                'pointerdown',
                () => {
                    mobileLeft = true;
                }
            );

            leftButton.addEventListener(
                'pointerup',
                () => {
                    mobileLeft = false;
                }
            );

            leftButton.addEventListener(
                'pointercancel',
                () => {
                    mobileLeft = false;
                }
            );

            leftButton.addEventListener(
                'pointerleave',
                () => {
                    mobileLeft = false;
                }
            );


            // Движение вправо

            rightButton.addEventListener(
                'pointerdown',
                () => {
                    mobileRight = true;
                }
            );

            rightButton.addEventListener(
                'pointerup',
                () => {
                    mobileRight = false;
                }
            );

            rightButton.addEventListener(
                'pointercancel',
                () => {
                    mobileRight = false;
                }
            );

            rightButton.addEventListener(
                'pointerleave',
                () => {
                    mobileRight = false;
                }
            );


            // Прыжок

            jumpButton.addEventListener(
                'pointerdown',
                () => {
                    mobileJump = true;
                }
            );

            jumpButton.addEventListener(
                'pointerup',
                () => {
                    mobileJump = false;
                }
            );

            jumpButton.addEventListener(
                'pointercancel',
                () => {
                    mobileJump = false;
                }
            );


            // Лазер

            laserButton.addEventListener(
                'pointerdown',
                () => {
                    mobileLaser = true;
                }
            );

            laserButton.addEventListener(
                'pointerup',
                () => {
                    mobileLaser = false;
                }
            );

            laserButton.addEventListener(
                'pointercancel',
                () => {
                    mobileLaser = false;
                }
            );
        }

        function setPlayerState(state) {

            if (playerState === state) {
                return;
            }

            playerState = state;

            switch (state) {

                case 'idle':
                    player.anims.play('player-idle', true);
                    break;

                case 'run':
                    player.anims.play('player-run', true);
                    break;

                case 'jump-up':
                    player.anims.play('player-jump-up', true);
                    break;

                case 'jump-fall':
                    player.anims.play('player-jump-fall', true);
                    break;

                case 'shoot':
                    player.anims.play('player-shoot', true);
                    break;
            }
        }

        function update() {

            const laserPressed =
                spaceKey.isDown || mobileLaser;

            // =====================================================
            // ДВИЖЕНИЕ ВРАГОВ
            // =====================================================

            if (enemies) {

                enemies.children.iterate((enemy) => {

                    if (!enemy || !enemy.active) {
                        return;
                    }

                    // =================================================
                    // FAST DRONE
                    // =================================================

                    if (enemy.enemyType === 'fastDrone') {

                        const camera = this.cameras.main;

                        const enemyOnScreen =
                            enemy.x >= camera.scrollX &&
                            enemy.x <= camera.scrollX + camera.width &&
                            enemy.y >= camera.scrollY &&
                            enemy.y <= camera.scrollY + camera.height;


                        // =============================================
                        // PATROL
                        // =============================================

                        if (enemy.fastState === 'patrol') {

                            enemy.setVelocityX(
                                enemy.direction * enemy.moveSpeed
                            );

                            if (enemy.x >= enemy.moveRight) {

                                enemy.direction = -1;

                                enemy.setFlipX(false);
                            }

                            if (enemy.x <= enemy.moveLeft) {

                                enemy.direction = 1;

                                enemy.setFlipX(true);
                            }

                            // Дрон появился в кадре
                            if (enemyOnScreen) {

                                enemy.fastState = 'detection';

                                enemy.fastStateTimer =
                                    this.time.now +
                                    FAST_DRONE_CONFIG.detectionDelay;
                            }

                            return;
                        }


                        // =============================================
                        // DETECTION
                        // =============================================

                        if (enemy.fastState === 'detection') {

                            // Пока обнаруживает игрока —
                            // продолжает обычное патрулирование

                            enemy.setVelocityX(
                                enemy.direction * enemy.moveSpeed
                            );

                            if (enemy.x >= enemy.moveRight) {

                                enemy.direction = -1;

                                enemy.setFlipX(false);
                            }

                            if (enemy.x <= enemy.moveLeft) {

                                enemy.direction = 1;

                                enemy.setFlipX(true);
                            }

                            // Если дрон снова исчез из кадра —
                            // возвращаем обычный патруль

                            if (!enemyOnScreen) {

                                enemy.fastState = 'patrol';
                                enemy.fastStateTimer = 0;

                                enemy.setTexture(
                                    'enemyFastDroneSprite'
                                );

                                return;
                            }

                            // Закончилось время обнаружения

                            if (
                                this.time.now >=
                                enemy.fastStateTimer
                            ) {

                                enemy.fastState = 'active';

                                enemy.setVelocityX(0);

                                enemy.setTexture(
                                    'enemyFastDroneActiveSprite'
                                );

                                enemy.fastStateTimer =
                                    this.time.now +
                                    FAST_DRONE_CONFIG.activeTime;
                            }

                            return;
                        }


                        // =============================================
                        // ACTIVE
                        // =============================================

                        if (enemy.fastState === 'active') {

                            enemy.setVelocityX(0);

                            // Если исчез из кадра —
                            // возвращаем патруль

                            if (!enemyOnScreen) {

                                enemy.fastState = 'patrol';
                                enemy.fastStateTimer = 0;

                                enemy.setTexture(
                                    'enemyFastDroneSprite'
                                );

                                return;
                            }

                            // Закончилось время остановки

                            if (
                                this.time.now >=
                                enemy.fastStateTimer
                            ) {

                                enemy.fastState = 'chase';
                            }

                            return;
                        }


                        // =============================================
                        // CHASE
                        // =============================================
                                            
                        if (enemy.fastState === 'chase') {
                        
                            // Если дрон исчез из кадра —
                            // возвращаем обычный патруль
                        
                            if (!enemyOnScreen) {
                            
                                enemy.fastState = 'patrol';
                                enemy.fastStateTimer = 0;
                            
                                enemy.setTexture(
                                    'enemyFastDroneSprite'
                                );
                            
                                return;
                            }
                        
                        
                            // =========================================
                            // ПРЕСЛЕДОВАНИЕ ИГРОКА
                            // =========================================
                        
                            if (player.x < enemy.x) {
                            
                                // Игрок слева
                            
                                enemy.direction = -1;
                            
                                // Если мы ещё можем двигаться влево
                                if (enemy.x > enemy.moveLeft) {
                                
                                    enemy.setVelocityX(
                                        -FAST_DRONE_CONFIG.chaseSpeed
                                    );
                                
                                    enemy.setFlipX(false);
                                
                                } else {
                                
                                    // Упёрлись в левую границу
                                    enemy.x = enemy.moveLeft;
                                    enemy.setVelocityX(0);
                                }
                            
                            } else {
                            
                                // Игрок справа
                            
                                enemy.direction = 1;
                            
                                // Если мы ещё можем двигаться вправо
                                if (enemy.x < enemy.moveRight) {
                                
                                    enemy.setVelocityX(
                                        FAST_DRONE_CONFIG.chaseSpeed
                                    );
                                
                                    enemy.setFlipX(true);
                                
                                } else {
                                
                                    // Упёрлись в правую границу
                                    enemy.x = enemy.moveRight;
                                    enemy.setVelocityX(0);
                                }
                            }
                            
                            return;
                        }
                    }

                    // =================================================
                    // ОБЫЧНЫЕ ВРАГИ
                    // =================================================

                    if (enemy.enemyType !== 'heavyDrone') {

                        enemy.setVelocityX(
                            enemy.direction * enemy.moveSpeed
                        );

                        // Правая граница движения
                        if (enemy.x >= enemy.moveRight) {

                            enemy.direction = -1;

                            enemy.setFlipX(false);
                        }

                        // Левая граница движения
                        if (enemy.x <= enemy.moveLeft) {

                            enemy.direction = 1;

                            enemy.setFlipX(true);
                        }

                        return;
                    }


                    // =================================================
                    // ТЯЖЁЛЫЙ ДРОН
                    // =================================================

                    const camera = this.cameras.main;

                    const enemyOnScreen =
                        enemy.x >= camera.scrollX &&
                        enemy.x <= camera.scrollX + camera.width &&
                        enemy.y >= camera.scrollY &&
                        enemy.y <= camera.scrollY + camera.height;


                    // =================================================
                    // PATROL
                    // =================================================

                    if (enemy.heavyState === 'patrol') {

                        // Дрон патрулирует
                        enemy.setVelocityX(
                            enemy.direction * enemy.moveSpeed
                        );

                        // Границы движения
                        if (enemy.x >= enemy.moveRight) {

                            enemy.direction = -1;

                            enemy.setFlipX(false);
                        }

                        if (enemy.x <= enemy.moveLeft) {

                            enemy.direction = 1;

                            enemy.setFlipX(true);
                        }


                        // Враг появился на экране
                        if (enemyOnScreen) {

                            enemy.heavyState = 'detection';

                            enemy.heavyStateTimer =
                                this.time.now +
                                HEAVY_DRONE_CONFIG.detectionDelay;

                            // На всякий случай возвращаем
                            // обычный спрайт
                            enemy.setTexture(
                                'enemyHeavyDroneSprite'
                            );
                        }

                        return;
                    }


                    // =================================================
                    // DETECTION
                    // =================================================

                    if (enemy.heavyState === 'detection') {

                        // Дрон продолжает патрулировать
                        enemy.setVelocityX(
                            enemy.direction * enemy.moveSpeed
                        );

                        // Границы движения
                        if (enemy.x >= enemy.moveRight) {

                            enemy.direction = -1;

                            enemy.setFlipX(false);
                        }

                        if (enemy.x <= enemy.moveLeft) {

                            enemy.direction = 1;

                            enemy.setFlipX(true);
                        }


                        // Враг ушёл с экрана
                        if (!enemyOnScreen) {

                            enemy.heavyState = 'patrol';

                            enemy.heavyStateTimer = 0;

                            enemy.setTexture(
                                'enemyHeavyDroneSprite'
                            );

                            return;
                        }


                        // Закончилась задержка обнаружения
                        if (
                            this.time.now >=
                            enemy.heavyStateTimer
                        ) {

                            enemy.heavyState = 'active';

                            enemy.setVelocityX(0);

                            enemy.setTexture(
                                'enemyHeavyDroneActiveSprite'
                            );

                            enemy.heavyStateTimer =
                                this.time.now +
                                HEAVY_DRONE_CONFIG.firstAimTime;
                        }

                        return;
                    }


                    // =================================================
                    // ACTIVE
                    // =================================================

                    if (enemy.heavyState === 'active') {

                        // Дрон стоит на месте
                        enemy.setVelocityX(0);

                        // Если игрок ушёл с экрана —
                        // возвращаемся к патрулированию
                        if (!enemyOnScreen) {

                            enemy.heavyState = 'patrol';

                            enemy.heavyStateTimer = 0;

                            enemy.setTexture(
                                'enemyHeavyDroneSprite'
                            );

                            return;
                        }

                        // Время прицеливания закончилось
                        if (
                            this.time.now >=
                            enemy.heavyStateTimer
                        ) {

                            // Выстрел!
                            fireHeavyDroneLaser.call(
                                this,
                                enemy
                            );

                            // Переходим в перезарядку
                            enemy.heavyState = 'reload';

                            enemy.setTexture(
                                'enemyHeavyDroneReloadSprite'
                            );

                            enemy.heavyStateTimer =
                                this.time.now +
                                HEAVY_DRONE_CONFIG.reloadTime;
                        }

                        return;
                    }

                    // =================================================
                    // RELOAD
                    // =================================================

                    if (enemy.heavyState === 'reload') {

                        enemy.setVelocityX(0);

                        // Если дрон ушёл с экрана —
                        // возвращаем его в обычное патрулирование
                        if (!enemyOnScreen) {

                            enemy.heavyState = 'patrol';
                            enemy.heavyStateTimer = 0;

                            enemy.setTexture(
                                'enemyHeavyDroneSprite'
                            );

                            return;
                        }

                        // Перезарядка закончилась
                        if (
                            this.time.now >=
                            enemy.heavyStateTimer
                        ) {

                            enemy.heavyState = 'active';

                            enemy.setTexture(
                                'enemyHeavyDroneActiveSprite'
                            );

                            enemy.heavyStateTimer =
                                this.time.now +
                                HEAVY_DRONE_CONFIG.repeatAimTime;
                        }

                        return;
                    }

                });
            }
            
            // =====================================================
            // ДВИЖЕНИЕ И СОСТОЯНИЕ ИГРОКА
            // =====================================================

            if (!player.isTakingDamage) {

                if (
                    cursors.left.isDown ||
                    mobileLeft
                ) {

                    player.setVelocityX(-250);
                    player.setFlipX(true);
                    lastDirection = -1;

                } else if (
                    cursors.right.isDown ||
                    mobileRight
                ) {

                    player.setVelocityX(250);
                    player.setFlipX(false);
                    lastDirection = 1;

                } else {

                    player.setVelocityX(0);
                }
            }

            // =====================================================
            // ОПРЕДЕЛЯЕМ СОСТОЯНИЕ ИГРОКА
            // =====================================================

            if (!player.isTakingDamage) {

                if (
                    laserPressed &&
                    laserEnergy > 0
                ) {
                    setPlayerState('shoot');
                }
                else if (!player.body.blocked.down) {

                    if (player.body.velocity.y < 0) {

                        setPlayerState('jump-up');

                    }
                    else {

                        setPlayerState('jump-fall');

                    }

                }
                else if (player.body.velocity.x !== 0) {

                    setPlayerState('run');

                }
                else {

                    setPlayerState('idle');

                }
            }


            // Прыжок
            if (
                !player.isTakingDamage &&
                (
                    cursors.up.isDown ||
                    mobileJump
                ) &&
                player.body.blocked.down
            ) {
                player.setVelocityY(-600);
            }

            playerLaser.clear();

            if (
                laserPressed &&
                laserEnergy > 0
            ) {

                playerLaser.lineStyle(
                    6,
                    0xff0000,
                    1
                );

                const startX =
                    player.x +
                    lastDirection * (player.displayWidth / 2);
                const laserY = player.y - player.displayHeight * 0.15;

                const camera = this.cameras.main;

                const endX =
                    lastDirection === 1
                        ? camera.scrollX + camera.width
                        : camera.scrollX;

                playerLaser.beginPath();

                playerLaser.moveTo(
                    startX,
                    laserY
                );

                playerLaser.lineTo(
                    endX,
                    laserY
                );

                playerLaser.strokePath();


                // Расход энергии

                laserEnergy -=
                    laserEnergyDrain *
                    (this.game.loop.delta / 1000);

                if (laserEnergy < 0) {
                    laserEnergy = 0;
                }

                energyText.setText(
                    'LASER ENERGY: ' +
                    Math.ceil(laserEnergy)
                );
            }

            // =====================================================
            // ПРОВЕРЯЕМ ПОПАДАНИЕ ЛАЗЕРА ВО ВРАГОВ
            // =====================================================

            if (
                enemies &&
                laserPressed &&
                laserEnergy > 0
            ) {

                const laserStartX =
                    player.x +
                    lastDirection * (player.displayWidth / 2);

                const camera = this.cameras.main;

                const laserEndX =
                    lastDirection === 1
                        ? camera.scrollX + camera.width
                        : camera.scrollX;

                const laserY =
                    player.y -
                    player.displayHeight * 0.15;

                enemies.children.iterate((enemy) => {

                    if (!enemy || !enemy.active) {
                        return;
                    }

                    const enemyIsInLaserX =
                        enemy.x >= Math.min(
                            laserStartX,
                            laserEndX
                        ) &&
                        enemy.x <= Math.max(
                            laserStartX,
                            laserEndX
                        );

                    const enemyIsInLaserY =
                        Math.abs(
                            enemy.y - laserY
                        ) < 25;

                    if (
                        enemyIsInLaserX &&
                        enemyIsInLaserY
                    ) {

                        enemy.destroy();

                    }

                });
            }

            // Проверка попадания лазера в переключатель
            if (
                laserSwitch &&
                laserSwitch.active &&
                laserPressed &&
                laserEnergy > 0
            ) {

                const laserStartX =
                    player.x +
                    lastDirection * (player.displayWidth / 2);

                const laserEndX =
                    lastDirection === 1
                        ? this.cameras.main.scrollX +
                        this.cameras.main.width
                        : this.cameras.main.scrollX;

                const switchX = laserSwitch.x;

                const switchBounds =
                    laserSwitch.getBounds();

                const laserY =
                    player.y - player.displayHeight * 0.15;

                const laserHitsSwitch =
                    laserY >= switchBounds.top &&
                    laserY <= switchBounds.bottom &&
                    (
                        lastDirection === 1
                            ? switchBounds.left >= laserStartX &&
                            switchBounds.left <= laserEndX
                            : switchBounds.right <= laserStartX &&
                            switchBounds.right >= laserEndX
                    );

                if (laserHitsSwitch) {

                    switchProgress = Math.min(
                        2,
                        switchProgress +
                        this.game.loop.delta / 1000
                    );

                    switchText.setText(
                        'MECHANISM: ' +
                        Math.floor(
                            switchProgress * 50
                        ) +
                        '%'
                    );

                    if (switchProgress >= 2) {

                        switchActivated = true;

                        laserSwitch.setTint(
                            0x00ff00
                        );

                        door.disableBody(
                            true,
                            true
                        );
                    }

                    switchText.setText(
                        'MECHANISM: ' +
                        Math.floor(
                            switchProgress * 50
                        ) +
                        '%'
                    );
                }
            }

            // Не даём игроку выйти за пределы уровня по горизонтали

            if (player.x < 20) {
                player.x = 20;
                player.setVelocityX(0);
            }

            if (player.x > currentLevelData.width - 20) {
                player.x = currentLevelData.width - 20;
                player.setVelocityX(0);
            }

            // =====================================================
            // ПАДЕНИЕ В ПРОПАСТЬ
            // =====================================================

            if (player.y > 750) {

                playerDeath.call(this);

            }
        }

        function hitLaser(player, laser) {

            playerTakeDamage.call(
                this,
                laser.x
            );

        }

        function hitEnemy(player, enemy) {

            playerTakeDamage.call(
                this,
                enemy.x
            );

        }

        function reachFinish() {

            this.scene.start('Level2');

        }

        function restartGame() {

            this.scene.restart();

        }

        function collectBattery() {

            laserEnergy += 100;

            battery.destroy();

            energyText.setText(
                'LASER ENERGY: ' + laserEnergy
            );
        }

        function updateLivesText() {

            let hearts = '';

            for (let i = 0; i < lives; i++) {
                hearts += '❤️';
            }

            livesText.setText(
                'LIVES: ' + hearts
            );
        }

        function playerDeath() {

            // Игрок получил обычный урон
            lives--;

            updateLivesText();

            // Если сердечки закончились —
            // перезапускаем текущий уровень
            if (lives <= 0) {

                this.scene.restart();

                return;
            }

            // Возвращаем игрока на последний чекпоинт
            player.setPosition(
                checkpointX,
                checkpointY
            );

            this.cameras.main.centerOn(
                checkpointX,
                checkpointY
            );

            player.setVelocity(
                0,
                0
            );
        }

        function playerTakeDamage(sourceX) {

            // Если игрок временно неуязвим —
            // новый удар игнорируем
            if (player.isTakingDamage) {
                return;
            }

            player.isTakingDamage = true;

            // Минус одно сердечко
            lives--;

            updateLivesText();

            // Определяем направление отбрасывания
            // Источник слева → игрок летит вправо
            // Источник справа → игрок летит влево
            const knockbackDirection =
                player.x < sourceX ? -1 : 1;

            // Останавливаем текущее движение
            player.setVelocityX(0);

            // Отбрасывание
            player.setVelocityX(
                knockbackDirection * 200
            );

            // Небольшой прыжок при получении урона
            player.setVelocityY(-300);

            // Меняем спрайт на изображение получения урона
            player.setTexture(
                'playerHit'
            );

            // Держим спрайт получения урона 500 мс
            this.time.delayedCall(
                500,
                () => {

                    if (player.active) {
                        setPlayerState('idle');
                    }
                }
            );

            // Неуязвимость после получения удара —
            // 800 мс
            this.time.delayedCall(
                800,
                () => {

                    if (player.active) {
                        player.isTakingDamage = false;
                    }
                }
            );

            // Если сердечки закончились —
            // перезапускаем текущий уровень
            if (lives <= 0) {

                this.time.delayedCall(
                    300,
                    () => {

                        this.scene.restart();

                    }
                );

                return;
            }
        }

        function fireHeavyDroneLaser(enemy) {

            if (!player || !player.active) {
                return;
            }

            // =========================================
            // ТОЧКА ВЫСТРЕЛА
            // =========================================

            const startX = enemy.x;
            const startY = enemy.y;

            // =========================================
            // ДРОН СТРЕЛЯЕТ В ТЕКУЩУЮ ПОЗИЦИЮ ИГРОКА
            // =========================================

            const endX = player.x;
            const endY = player.y;

            // =========================================
            // ИЩЕМ БЛИЖАЙШУЮ ПЛАТФОРМУ НА ПУТИ ЛАЗЕРА
            // =========================================

            const laserLine = new Phaser.Geom.Line(
                startX,
                startY,
                endX,
                endY
            );

            let laserEndX = endX;
            let laserEndY = endY;

            let closestHitDistance =
                Phaser.Math.Distance.Between(
                    startX,
                    startY,
                    endX,
                    endY
                );

            let laserHitPlatform = false;

            platforms.children.iterate((platform) => {

                if (!platform || !platform.active) {
                    return;
                }

                const bounds = platform.getBounds();

                const intersectionPoints =
                    Phaser.Geom.Intersects.GetLineToRectangle(
                        laserLine,
                        bounds
                    );

                if (!intersectionPoints || intersectionPoints.length === 0) {
                    return;
                }

                // Проверяем все точки пересечения
                // и выбираем ближайшую к дрону.

                intersectionPoints.forEach((point) => {

                    const distance =
                        Phaser.Math.Distance.Between(
                            startX,
                            startY,
                            point.x,
                            point.y
                        );

                    if (distance < closestHitDistance) {

                        closestHitDistance = distance;

                        laserEndX = point.x;
                        laserEndY = point.y;

                        laserHitPlatform = true;
                    }
                });
            });

            // =========================================
            // РИСУЕМ ЛАЗЕР
            // =========================================

            heavyDroneLaser.clear();

            heavyDroneLaser.lineStyle(
                6,
                0xff0000,
                1
            );

            heavyDroneLaser.beginPath();

            heavyDroneLaser.moveTo(
                startX,
                startY
            );

            heavyDroneLaser.lineTo(
                laserEndX,
                laserEndY
            );

            heavyDroneLaser.strokePath();

            // =========================================
            // ПРОВЕРЯЕМ ПОПАДАНИЕ В ИГРОКА
            // =========================================

            let hitPlayer = false;

            if (!laserHitPlatform) {

                const laserLength =
                    Phaser.Math.Distance.Between(
                        startX,
                        startY,
                        endX,
                        endY
                    );

                const steps =
                    Math.ceil(laserLength / 10);

                for (let i = 0; i <= steps; i++) {

                    const t = i / steps;

                    const laserX =
                        Phaser.Math.Linear(
                            startX,
                            endX,
                            t
                        );

                    const laserY =
                        Phaser.Math.Linear(
                            startY,
                            endY,
                            t
                        );

                    const distanceToPlayer =
                        Phaser.Math.Distance.Between(
                            laserX,
                            laserY,
                            player.x,
                            player.y
                        );

                    if (distanceToPlayer < 30) {

                        hitPlayer = true;
                        break;
                    }
                }
            }

            if (hitPlayer) {

                playerTakeDamage.call(
                    this,
                    enemy.x
                );
            }

            // =========================================
            // УБИРАЕМ ЛАЗЕР
            // =========================================

            this.time.delayedCall(
                HEAVY_DRONE_CONFIG.laserDuration,
                () => {

                    if (heavyDroneLaser) {
                        heavyDroneLaser.clear();
                    }

                }
            );
        }

        function collectExtraLife(player, life) {

            if (lives < maxLives) {

                lives++;

                updateLivesText();

                life.disableBody(
                    true,
                    true
                );
            }
        }

        function activateCheckpoint(player, checkpoint) {

            checkpointX = checkpoint.x;
            checkpointY = checkpoint.y;

            checkpointActivated = true;

            checkpoint.setTint(
                0x00ff00
            );
        }

        // =====================================================
        // LEVEL 2
        // =====================================================

        function createLevel2() {

            this.add.text(
                640,
                200,
                'LEVEL 2',
                {
                    fontFamily: 'Arial',
                    fontSize: '64px',
                    color: '#ffffff'
                }
            ).setOrigin(0.5);


            this.add.text(
                640,
                300,
                'Новый уровень',
                {
                    fontFamily: 'Arial',
                    fontSize: '28px',
                    color: '#aaaaaa'
                }
            ).setOrigin(0.5);
        }


        function updateLevel2() {

        }

    </script>
